[project]
name = "approximately-up-extraction"
version = "0.1.0"
description = "Component/planet/objective data extraction for the Approximately Up wiki"
requires-python = ">=3.12"

# UnityPy and TypeTreeGeneratorAPI are pinned exactly: both reach into Unity's
# serialized-file internals and have changed their APIs across patch releases,
# and the committed data in web/data/ was produced by these versions. numpy and
# Pillow are only used for array maths and PNG I/O, so a major-version bound is
# enough there.
dependencies = [
    "UnityPy==1.25.3",
    "TypeTreeGeneratorAPI==0.0.10",
    "numpy>=2.0,<3",
    "Pillow>=11,<13",
]

[project.optional-dependencies]
# Upper bounds, unlike the JS side. There is no lockfile here: CI resolves
# these fresh on every run, so an unbounded `ruff>=0.16` means a 0.17 that
# enables new rules by default fails a commit that touched nothing. The
# ceilings are what a package-lock.json does for npm.
#
# Keep in step with the same two pins in .github/workflows/_lint.yml, which
# installs these directly rather than via this extra -- the extra would drag
# in UnityPy and TypeTreeGeneratorAPI, and no runner needs those.
dev = [
    "pytest>=9,<10",
    "ruff>=0.16,<0.17",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# `generator` is a real package, so `pip install -e ".[dev]"` puts it on the
# path and every tool runs as `python -m generator.<name>` from anywhere.
[tool.setuptools]
packages = ["generator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
# This directory, so `from generator import config` resolves without the
# package having to be pip-installed first.
pythonpath = ["."]

[tool.ruff]
line-length = 96
# Matches requires-python. Raising this is what lets the UP rules rewrite for
# 3.12 syntax rather than holding the code at 3.10's.
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import sorting
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "RET",       # return style
]
ignore = [
    # The extraction tools deliberately swallow per-item failures from UnityPy
    # and the type-tree generator: a stub DLL that will not load, or a
    # MonoBehaviour whose script reference is stripped, is an expected outcome
    # for some inputs, not a reason to abandon the run. Where the failure means
    # data loss it is collected into a `warnings` list and printed instead.
    "S110",
    # `except Exception` around third-party binary parsing is intentional --
    # UnityPy raises a wide and undocumented range of types.
    "BLE001",
]

# `generator` is only discoverable as first-party when ruff runs with tools/ as
# the working directory. Stated explicitly, the import order is the same whether
# the linter is invoked from here or from the repo root -- otherwise the two
# disagree and every test file reports I001 from one of them.
[tool.ruff.lint.isort]
known-first-party = ["generator"]


# `**/`-prefixed so the globs match whatever directory ruff is invoked from.
# Bare `tests/*` only matches when the working directory is tools/, which meant
# linting the repo from the root silently dropped every ignore here and
# reported 53 errors in files that are deliberately exempt.
[tool.ruff.lint.per-file-ignores]
# Tests read tool sources as text to assert structural properties; a context
# manager for a one-line read adds noise without adding safety.
"**/tests/*" = ["SIM115"]
# The il2cpp.cs fixture is a verbatim excerpt of the dumper's output, tabs and
# all, so that the parser under test sees the whitespace it sees in the wild.
"**/tests/test_parse_cs.py" = ["E101", "W191"]
