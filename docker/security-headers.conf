# Included into every location block, because nginx's add_header does not
# accumulate across contexts: a location that sets ANY add_header discards the
# entire inherited set. Every location here sets Cache-Control, so the three
# headers declared at server level reached exactly nothing -- they were absent
# from every response the wiki served, in the container and through the proxy
# alike.
#
# nginx offers no better mechanism without headers-more, which is not in the
# stock image. An include is the least error-prone version of "repeat these in
# every location": adding a fourth header means editing one file, and a new
# location needs one line rather than three.
#
# The server-level copies stay as well, for responses nginx generates before
# any location matches -- a malformed request line, say.

add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options SAMEORIGIN always;
