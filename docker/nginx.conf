# Serving config for the wiki container.
#
# This sits BEHIND a reverse proxy, which owns TLS, HSTS and the real
# hostname. Nothing here terminates TLS or redirects to https -- doing that in
# both places is how you get a redirect loop.

# Whether a /data/ request may be cached forever comes down to one thing: did
# it name the file's content hash? DataService always does. A hand-typed or
# shared link does not, and must not be pinned in a reader's cache for a year.
map $arg_v $data_cache_control {
    ""      "no-cache";
    default "public, max-age=31536000, immutable";
}

server {
    # 8080, not 80: the container runs as an unprivileged user, which cannot
    # bind a port below 1024.
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # The proxy already logs, and duplicate access logs are just disk.
    access_log off;

    # Real client addresses in error logs, from the proxy's own headers.
    # Restricted to private ranges so a forged header from the open internet
    # cannot spoof one.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from fc00::/7;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Content-level headers. Transport-level ones (HSTS) belong on the proxy,
    # which is the thing that actually speaks TLS.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Serve the .gz the build already produced. Falls back to the runtime gzip
    # below for anything not precompressed.
    gzip_static on;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    # No image types: PNG is already compressed, and gzipping it burns CPU to
    # make it very slightly bigger. components_full.json is the one that
    # matters here -- 616 kB of JSON down to well under a tenth of that.
    # application/xml is the sitemap: 426 <loc> elements of near-identical
    # text, which is about as compressible as a file gets.
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json application/xml;

    # A liveness probe for the orchestrator that does not pull in the SPA.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Hashed build output (outputHashing: all) -- the filename changes
    # whenever the contents do, so it can be cached forever.
    #
    # Angular separates the hash with a HYPHEN, not a dot: chunk-2WKYF2Sz.js,
    # main-DVEEXWSN.js, media/chakra-petch-latin-500-normal-ONCMP4EF.woff2.
    # The hash alphabet includes '-' itself (chunk-Bf-8H4aA.js), which is why
    # the class below has to allow it.
    location ~* "-[0-9A-Za-z_-]{8,}\.(js|css|woff2?)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # One rule for all extracted data, keyed on the content hash rather than on
    # file type. The old split -- revalidate JSON, cache images for a week --
    # existed because nothing was versioned; now that everything is, the
    # distinction that matters is versioned vs not.
    #
    # try_files ... =404 is load-bearing: a missing data file must 404 rather
    # than fall through to the SPA. DataService.failed and the banner in
    # app.html:45 both depend on an error status to tell "this host is missing
    # its assets" apart from "this wiki is empty".
    location ^~ /data/ {
        add_header Cache-Control $data_cache_control always;
        try_files $uri =404;
    }


    # Unhashed static files at the root. A day is long enough to matter for
    # the favicon and the link-preview card, and short enough that replacing
    # either does not need a cache-busting rename.
    #
    # robots.txt is here for the same reason: a crawler refetches it on its own
    # schedule, and a day of staleness costs nothing.
    location ~* ^/(favicon\.ico|og-card\.png|robots\.txt)$ {
        add_header Cache-Control "public, max-age=86400" always;
    }

    # The two files whose Content-Type nginx gets wrong on its own. An exact
    # `location =` beats the regex above, so each repeats the cache header
    # rather than inheriting one.
    #
    # A `types` block, not `default_type`: default_type is only consulted when
    # the extension is unknown, and .xml is known -- as text/xml, which is not
    # what the sitemap protocol names.
    location = /sitemap.xml {
        types { }
        default_type application/xml;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # .webmanifest is genuinely absent from mime.types, so this one really is
    # a default: without it the manifest is served as application/octet-stream
    # and the browser ignores it.
    location = /site.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # Prerendered pages, and the fallback for an address that has none.
    #
    # The build writes one directory per route -- /components/Abs/index.html,
    # 426 of them -- so a deep link is now a real file and $uri/index.html
    # finds it. That is the whole point of prerendering: a crawler, an unfurl
    # and a reader with no JavaScript all get the page rather than an empty
    # shell.
    #
    # The fallback is index.csr.html, NOT index.html, and the difference
    # matters. index.html is now the prerendered HOME PAGE, complete with its
    # own title and content; serving it for /components/NoSuchThing would show
    # the reader the front page under a wrong address and hand a crawler the
    # home page's text under a URL that does not exist. index.csr.html is the
    # empty shell, which boots the app and lands on the 404 page.
    #
    # It is reached through error_page rather than as a third try_files
    # argument so the response keeps its 404 status. An unknown address used
    # to answer 200 -- a soft 404, which is a page apologising under a URL a
    # crawler then indexes. Now the status and the page agree, which is what
    # the note in not-found.ts had been waiting for prerendering to allow.
    #
    # error_page sits inside this location, so it governs unknown PAGES only.
    # A missing file under /data/ keeps its own bare 404 from the location
    # above; DataService.failed reads the status, and handing it a page of
    # HTML instead would tell it nothing it wants to know.
    #
    # Cache-Control lives here rather than in a `location ~ \.html$` block
    # because try_files serves the file it finds in THIS location's context; a
    # regex location for .html would never be consulted. Everything that can
    # be cached -- hashed bundles, /data/, the icons -- has its own location
    # above, so what is left here is HTML, and HTML must never be cached: it
    # names the current hashed bundles, and a stale copy pins the reader to a
    # build that no longer exists on disk.
    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/index.html =404;
        error_page 404 /index.csr.html;
    }

    # Served only as the 404 body above, never fetched directly.
    location = /index.csr.html {
        internal;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
}
