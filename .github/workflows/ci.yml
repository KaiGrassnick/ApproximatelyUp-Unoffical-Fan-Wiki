# Every branch except main, and pull requests from forks.
#
# Nothing here publishes: the image is built and smoke tested on the runner and
# then thrown away. This workflow is granted no `packages: write`, so that is
# enforced by the token and not only by the `push: false` below.
name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

# A branch that got a second push does not need the first one's results.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A branch in this repository with an open PR fires both `push` and
  # `pull_request`, which would run everything below twice. Fork branches fire
  # only `pull_request`, because their pushes land on the fork. So: take pushes
  # from here, and pull requests from anywhere else.
  lint:
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository
    uses: ./.github/workflows/_lint.yml

  image:
    # Only after the app itself is known good: an image built from failing
    # source is a slower way to find out.
    needs: lint
    uses: ./.github/workflows/_image.yml
    with:
      push: false
