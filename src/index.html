<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Overridden per route by the router's `title` (see app.routes.ts). This
       is what a crawler, a Discord unfurl and the first paint see. -->
    <title>Approximately Up — Unofficial Fan Wiki</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Components, planets, stations and missions for the spaceship-building game Approximately Up. Stats pulled straight from the game files; drop in your own save to see what you can build."
    />
    <meta name="theme-color" content="#05070d" />

    <!-- BEGIN generated by scripts/gen-data-manifest.mjs -- do not edit.
       The five files DataService fetches on every route, started here rather
       than left for main.js to discover. Without these the browser cannot
       know they exist until Angular has downloaded, parsed and booted, which
       measured as a 326 ms gap between main.js arriving and the first data
       request going out -- and both render gates in app.config.ts wait on
       this data, so that gap is time the page is not interactive.
       The ?v= hashes must match DATA_MANIFEST, which is why this is
       generated and not typed. -->
    <link rel="preload" as="fetch" crossorigin href="data/components_full.json?v=f3aa9c07" />
    <link rel="preload" as="fetch" crossorigin href="data/planets.json?v=4f91fa42" />
    <link rel="preload" as="fetch" crossorigin href="data/objectives.json?v=538ea3fa" />
    <link rel="preload" as="fetch" crossorigin href="data/icons.json?v=efb37534" />
    <link rel="preload" as="fetch" crossorigin href="data/stat_labels.json?v=1dfa5c33" />
    <!-- END generated -->

    <!-- The home page's own address. SeoService rewrites this on every
       navigation (see src/app/core/seo.service.ts); it is here so that the
       first paint, and any crawler that does not run JavaScript, still get a
       canonical URL rather than none. Same reasoning for og:url below. -->
    <link rel="canonical" href="https://aup-fan-wiki.org/" />
    <meta name="robots" content="index, follow" />

    <!-- Link previews. Every link to this wiki gets pasted into the game's own
       Discord sooner or later, and without these it unfurls as a bare URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Approximately Up — Unofficial Fan Wiki" />
    <meta property="og:title" content="Approximately Up — Unofficial Fan Wiki" />
    <meta
      property="og:description"
      content="Components, planets, stations and missions, pulled straight from the game files. Drop in your own save to see what you can build."
    />
    <meta property="og:url" content="https://aup-fan-wiki.org/" />
    <meta property="og:locale" content="en_US" />
    <!-- Absolute, not "/og-card.png": the spec requires it, and the crawlers
       that tolerate a relative URL are not the ones this is for. -->
    <meta property="og:image" content="https://aup-fan-wiki.org/og-card.png" />
    <meta property="og:image:alt" content="Approximately Up — Unofficial Fan Wiki" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Approximately Up — Unofficial Fan Wiki" />
    <meta
      name="twitter:description"
      content="Components, planets, stations and missions, pulled straight from the game files. Drop in your own save to see what you can build."
    />
    <meta name="twitter:image" content="https://aup-fan-wiki.org/og-card.png" />

    <!-- The SVG is the real icon (see public/favicon.svg for the reasoning);
       the .ico is the same mark rasterised for browsers that still want one,
       and the touch icon is for the home-screen bookmark on a phone. -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />

    <!-- What this site IS, for a crawler that reads structured data rather
       than prose. Static because it describes the wiki rather than the page:
       the per-page BreadcrumbList is written by SeoService at runtime.

       isPartOf/publisher are deliberately absent. This is a fan project with
       no organisation behind it, and inventing one to fill a schema.org slot
       would be the one dishonest thing on the page. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Approximately Up — Unofficial Fan Wiki",
        "url": "https://aup-fan-wiki.org/",
        "description": "Components, planets, stations and missions for the spaceship-building game Approximately Up. Stats pulled straight from the game files; drop in your own save to see what you can build.",
        "inLanguage": "en",
        "about": {
          "@type": "VideoGame",
          "name": "Approximately Up"
        }
      }
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
